name: ASCI Mail 5.13.3 PHP

on:
  push:
    branches:
      - ci/asci-mail-5.13.3-backend

permissions:
  contents: read

jobs:
  phpunit:
    name: Nextcloud 35.0.2 / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    services:
      mariadb:
        image: ghcr.io/nextcloud/continuous-integration-mariadb-11.8:latest@sha256:9232089007ddc49b42e5a7e4cc158ac373efebed6885ea0f76e3d4e5f8532bac
        env:
          MARIADB_ROOT_PASSWORD: my-secret-pw
          MARIADB_DATABASE: nextcloud
          MARIADB_USER: nextcloud
          MARIADB_PASSWORD: nextcloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5
      dovecot:
        image: ghcr.io/christophwurst/docker-imap-devel:latest@sha256:b76a062268d7342ccec549f5323a0b6dc1b6ac55b03367f474934927653f5cb5
        env:
          MAILNAME: mail.domain.tld
          MAIL_ADDRESS: user@domain.tld
          MAIL_PASS: mypassword
        ports:
          - 993:993

    steps:
      - name: Install Nextcloud 35.0.2 with MariaDB
        uses: nextcloud/setup-server-action@34b73d5b0e3633f83a52227d00cc2a6c41d01d9a
        with:
          nextcloud-version: v35.0.2
          php-version: ${{ matrix.php }}
          node-version: 'false'
          php-coverage: none
          install: 'true'
          database: mysql

      - name: Check out Mail
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: nextcloud/apps/mail
          persist-credentials: false

      - name: Install locked Mail dependencies
        working-directory: nextcloud/apps/mail
        run: composer install --no-interaction --prefer-dist

      - name: Enable Mail and configure the local IMAP fixture
        id: prepare_mail
        run: |
          php nextcloud/occ app:enable mail
          php nextcloud/occ config:system:set allow_local_remote_servers --type bool --value true
          php nextcloud/occ config:system:set app.mail.verify-tls-peer --type bool --value false

      - name: Run the Mail unit suite
        working-directory: nextcloud/apps/mail
        run: composer run test:unit -- --no-coverage --fail-on-empty-test-suite

      - name: Run the MessageMapper integration tests with MariaDB
        if: ${{ !cancelled() && steps.prepare_mail.outcome == 'success' }}
        working-directory: nextcloud/apps/mail
        run: >-
          composer run test:integration -- --no-coverage --fail-on-empty-test-suite
          --fail-on-skipped tests/Integration/Db/MessageMapperTest.php

      - name: Run the ImapMessageFetcher integration tests with Dovecot
        if: ${{ !cancelled() && steps.prepare_mail.outcome == 'success' }}
        working-directory: nextcloud/apps/mail
        run: >-
          composer run test:integration -- --no-coverage --fail-on-empty-test-suite
          --fail-on-skipped tests/Integration/IMAP/ImapMessageFetcherIntegrationTest.php
