name: Unread-first integration

on:
  push:
    branches:
      - local/unread-first-5.12.4

permissions:
  contents: read

jobs:
  cursor-integration:
    name: Nextcloud 35 / PHP 8.4 / MariaDB
    runs-on: ubuntu-latest

    services:
      mariadb-service:
        image: ghcr.io/nextcloud/continuous-integration-mariadb-11.8:latest@sha256:9232089007ddc49b42e5a7e4cc158ac373efebed6885ea0f76e3d4e5f8532bac
        env:
          MARIADB_ROOT_PASSWORD: my-secret-pw
          MARIADB_DATABASE: nextcloud
          MARIADB_USER: nextcloud
          MARIADB_PASSWORD: nextcloud
        ports:
          - 3306:3306/tcp
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5

    steps:
      - name: Set up Nextcloud 35
        uses: nextcloud/setup-server-action@34b73d5b0e3633f83a52227d00cc2a6c41d01d9a
        with:
          nextcloud-version: stable35
          php-version: '8.4'
          install: true
          database: mysql
          node-version: 'false'

      - name: Checkout patched Mail
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: nextcloud/apps/mail

      - name: Install PHP dependencies
        working-directory: nextcloud/apps/mail
        run: composer install --no-interaction --prefer-dist

      - name: Enable Mail
        run: php -f nextcloud/occ app:enable mail --force

      - name: Test composite cursor pagination
        working-directory: nextcloud/apps/mail
        run: |
          composer run test:integration -- \
            --no-coverage \
            --filter testFindIdsByQueryUnreadFirstCursorWithEqualTimestamps

  mime-integration:
    name: Nextcloud 35 / PHP 8.4 / Dovecot MIME
    runs-on: ubuntu-latest

    services:
      mail-dovecot-service:
        image: ghcr.io/christophwurst/docker-imap-devel:latest@sha256:b76a062268d7342ccec549f5323a0b6dc1b6ac55b03367f474934927653f5cb5
        env:
          MAILNAME: mail.domain.tld
          MAIL_ADDRESS: user@domain.tld
          MAIL_PASS: mypassword
        ports:
          - 25:25
          - 143:143
          - 993:993
          - 4190:4190

      mariadb-service:
        image: ghcr.io/nextcloud/continuous-integration-mariadb-11.8:latest@sha256:9232089007ddc49b42e5a7e4cc158ac373efebed6885ea0f76e3d4e5f8532bac
        env:
          MARIADB_ROOT_PASSWORD: my-secret-pw
          MARIADB_DATABASE: nextcloud
          MARIADB_USER: nextcloud
          MARIADB_PASSWORD: nextcloud
        ports:
          - 3306:3306/tcp
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5

    steps:
      - name: Set up Nextcloud 35
        uses: nextcloud/setup-server-action@34b73d5b0e3633f83a52227d00cc2a6c41d01d9a
        with:
          nextcloud-version: stable35
          php-version: '8.4'
          install: true
          database: mysql
          node-version: 'false'

      - name: Checkout patched Mail
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: nextcloud/apps/mail

      - name: Install PHP dependencies
        working-directory: nextcloud/apps/mail
        run: composer install --no-interaction --prefer-dist

      - name: Enable Mail
        run: php -f nextcloud/occ app:enable mail --force

      - name: Configure test IMAP access
        run: |
          php -f nextcloud/occ config:system:set app.mail.verify-tls-peer --type bool --value false
          php -f nextcloud/occ config:system:set allow_local_remote_servers --type bool --value true

      - name: Test attachment-only MIME messages
        working-directory: nextcloud/apps/mail
        run: |
          composer run test:integration -- \
            --no-coverage \
            --filter 'testFetchMessageWithSinglePartAttachment|testSinglePartPdfAppearsInEnvelopeAttachments|testFetchMessageWithSinglePartInlineImage|testFetchMessageWithOpaqueSignedMessage'

  release-tarball:
    name: Build Mail 5.12.4 package
    needs: [cursor-integration, mime-integration]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patched Mail
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read Node and npm versions
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4
        id: versions

      - name: Set up packaging tools
        uses: nextcloud/setup-server-action@34b73d5b0e3633f83a52227d00cc2a6c41d01d9a
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          npm-version: ${{ steps.versions.outputs.npmVersion }}
          tools: 'krankerl'

      - name: Build release package
        run: krankerl package

      - name: Upload installable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mail-5.12.4-unread
          path: build/artifacts/mail.tar.gz
          if-no-files-found: error
          retention-days: 7
